name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tags:
        description: "Space-separated tags to release (empty = every tag missing a release)"
        required: false
        default: ""

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create GitHub releases with notes from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tags="$GITHUB_REF_NAME"
          else
            tags="${{ inputs.tags }}"
            [ -n "$tags" ] || tags=$(git tag -l 'v*' | sort -V)
          fi
          newest=$(git tag -l 'v*' | sort -V | tail -1)
          for tag in $tags; do
            if gh release view "$tag" --json tagName >/dev/null 2>&1; then
              echo "$tag: release already exists, skipping"
              continue
            fi
            version="${tag#v}"
            awk -v ver="$version" '
              index($0, "## [" ver "]") == 1 { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > notes.md
            if ! grep -q '[^[:space:]]' notes.md; then
              echo "See [CHANGELOG.md](CHANGELOG.md)." > notes.md
            fi
            latest="--latest=false"
            [ "$tag" = "$newest" ] && latest="--latest"
            gh release create "$tag" --verify-tag --title "$tag" --notes-file notes.md "$latest"
            echo "$tag: release created"
          done

  # Trusted publishing (OIDC): no NPM_TOKEN, provenance is attested automatically.
  # npmjs.com registers this by filename, so renaming release.yml breaks publishing.
  # Only tag pushes publish; the workflow_dispatch backfill exists to fill in
  # missing GitHub releases and must never republish an already-shipped version.
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Trusted publishing needs npm >= 11.5.1
        run: npm install -g npm@latest
      - name: Tag must match the version being published
        run: |
          version=$(npm pkg get version | tr -d '"')
          [ "v$version" = "$GITHUB_REF_NAME" ] || {
            echo "tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          }
      - run: npm ci
      - run: npm test
      - run: npm publish

  # The registry verifies ownership by fetching the published npm package and matching
  # its mcpName against server.json, so this can only run once publish has succeeded.
  registry:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Install mcp-publisher
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/').tar.gz" \
            | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/
      - name: Publish to the MCP Registry
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish
