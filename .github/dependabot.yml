version: 2
updates:
  # Workflow actions are pinned to commit SHAs; Dependabot is what keeps those
  # pins current, so this entry is required rather than optional.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "Bump"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "Bump"
